<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Module 9 — Matières dangereuses</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
  :root{--bg:#ece9e2;--panel:#fff;--panel-2:#f5f6f2;--line:#dcdfd7;--ink:#1c211d;--soft:#5f675e;
    --accent:#e07a00;--ok:#1a8a4f;--bad:#d92c1e;--warn:#d98a00;--shadow:0 1px 2px rgba(20,30,20,.06),0 10px 30px rgba(20,30,20,.08);}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14150f;--panel:#1d211b;--panel-2:#23281f;--line:#333a2e;--ink:#e9ece3;--soft:#a3ab9d;--accent:#ff9a2e;--ok:#37d996;--bad:#ff6b5e;--warn:#f0a83a;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{--bg:#14150f;--panel:#1d211b;--panel-2:#23281f;--line:#333a2e;--ink:#e9ece3;--soft:#a3ab9d;--accent:#ff9a2e;--ok:#37d996;--bad:#ff6b5e;--warn:#f0a83a;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.4);}
  *{box-sizing:border-box}html,body{min-height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;padding:20px 16px 40px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:660px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .badge{width:46px;height:46px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-size:24px;flex:none;transform:rotate(45deg)}
  .badge span{transform:rotate(-45deg)}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.4px;font-size:24px;margin:0;line-height:1}
  header p{margin:3px 0 0;font-size:12.5px;color:var(--soft)}
  .theme{margin-left:auto;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer;font-family:inherit}
  h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-size:15px;color:var(--soft);margin:24px 0 10px}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mode{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;box-shadow:var(--shadow);transition:.14s;font-family:inherit;color:inherit}
  .mode:hover{transform:translateY(-2px);border-color:var(--accent)}
  .mode .ic{font-size:24px}
  .mode .t{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.3px}
  .mode .d{font-size:12px;color:var(--soft);line-height:1.4}
  .mode .ch{font-size:10.5px;font-weight:700;letter-spacing:.6px;color:var(--accent);text-transform:uppercase}
  .mode.full{grid-column:1/-1}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px;margin-top:4px}
  .topline{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .back{font-size:13px;color:var(--soft);background:none;border:none;cursor:pointer;padding:0;font-family:inherit}
  .prog{flex:1;height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden}
  .prog>i{display:block;height:100%;background:var(--accent);width:0;transition:.3s}
  .count{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
  .ctx{border-left:4px solid var(--accent);background:var(--panel-2);border-radius:0 11px 11px 0;padding:12px 14px;margin:0 0 16px;font-size:14px;line-height:1.55}
  .ctx .ctitle{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.4px;font-size:15px;margin-bottom:4px}
  .ctx .data{margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
  .q{font-size:12px;color:var(--accent);margin:0 0 6px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .qbig{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;line-height:1.2;margin:0 0 18px;text-wrap:balance}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{font-family:inherit;font-size:15px;text-align:left;background:var(--panel-2);color:var(--ink);border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;transition:.12s;line-height:1.35}
  .opt:hover:not(:disabled){border-color:var(--soft)}
  .opt:disabled{cursor:default}
  .opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent);font-weight:600}
  .opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
  .expl{margin:16px 0 0;padding:12px 14px;background:var(--panel-2);border-radius:11px;font-size:13.5px;line-height:1.5}
  .expl b{color:var(--accent)}
  .next{margin-top:16px;width:100%;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.4px;background:var(--accent);color:#fff;border:none;border-radius:11px;padding:13px;cursor:pointer}
  .result{text-align:center;padding:10px 0}
  .score{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:56px;line-height:1}
  .result .msg{font-size:16px;margin:8px 0 22px}
  .result .row{display:flex;gap:10px}
  .result .row button{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.4px;font-size:15px;border-radius:11px;padding:13px;cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
  .result .row button.primary{background:var(--accent);color:#fff;border-color:transparent}
  [hidden]{display:none!important}
  footer{margin-top:22px;font-size:12px;color:var(--soft);text-align:center;line-height:1.5}
  footer a{color:var(--accent)}
  @media (max-width:420px){.modes{grid-template-columns:1fr}}
</style>
</head>

<div class="wrap">

    <div class="badge"><span>☣️</span></div>

  <footer>Révision — Module 9, Matières dangereuses niveau opération. Les pages-guides citées renvoient au GMU 2024 : vérifie toujours dans ton guide.<br><a href="../">Menu des exercices</a></footer>

<script>
/* =========================================================
   MISES EN SITUATION
   Chaque question : q (énoncé), a (bonne réponse), w (mauvaises), e (explication)
   ========================================================= */
const SCENARIOS=[
{id:"ethanol",ic:"🚛",t:"Citerne renversée",d:"Classe 3, code Kemler, contamination",
 ctx:"Mardi, 7 h 40, autoroute 40. Un camion-citerne s'est couché dans le fossé après une sortie de route. Le chauffeur est sorti seul et attend près de la glissière. Un liquide clair s'écoule de la citerne vers le fossé, où il forme une flaque d'environ 6 m sur 4 m. Le placard porte une flamme sur fond rouge avec le chiffre 3 en bas. Le panneau orange indique « 33 » en haut et « 1170 » en bas. Vent d'ouest à 15 km/h.",
 qs:[
 {q:"Que t'indique le placard rouge avec une flamme et le chiffre 3 ?",a:"Classe 3 : liquide inflammable",w:["Classe 3 : gaz inflammable","Classe 3 : matière comburante","Classe 3 : solide inflammable"],e:"Classe 3 du TMD = <b>liquides inflammables</b>. Les gaz inflammables sont en classe 2.1."},
 {q:"Sur le panneau orange, que représentent « 33 » et « 1170 » ?",a:"33 = code de danger (Kemler), 1170 = numéro ONU (NIP) du produit",w:["33 = numéro du guide, 1170 = quantité en litres","33 = NIP du produit, 1170 = code de danger","33 = classe et division, 1170 = numéro de la citerne"],e:"Code Kemler : en haut, le <b>code de danger</b> (un chiffre doublé indique un danger plus intense : 33 = liquide très inflammable). En bas, le <b>NIP / numéro ONU</b>, qu'on cherche dans les pages jaunes du GMU."},
 {q:"Le NIP 1170 correspond à l'éthanol (guide 127). Où as-tu trouvé le numéro du guide ?",a:"Dans les pages jaunes (classées par NIP)",w:["Dans les pages vertes","Dans les pages orange","Sur le placard de classe"],e:"Pages <b>jaunes</b> = recherche par NIP. Pages <b>bleues</b> = recherche par nom du produit. Les deux renvoient au guide (pages orange)."},
 {q:"Un pompier marche dans la flaque pour aller voir la citerne. Ses bottes sont imprégnées. De quel type de contamination s'agit-il ?",a:"Contamination primaire (contact direct avec le produit)",w:["Contamination secondaire","Contamination croisée par l'air","Aucune : les bottes protègent"],e:"<b>Primaire</b> = contact direct avec la matière. <b>Secondaire</b> = contact avec une personne ou un objet déjà contaminé. Le pompier peut maintenant contaminer d'autres personnes : il doit passer à la décontamination."},
 {q:"Selon le guide 127, quel isolement immédiat faut-il appliquer à titre de précaution ?",a:"Au moins 50 m dans toutes les directions",w:["Au moins 10 m autour de la flaque","Au moins 800 m dans toutes les directions","Au moins 1 600 m sous le vent"],e:"Guides 127/128 : isoler au moins <b>50 m</b> dans toutes les directions. Les 800 m s'appliquent quand une citerne est <b>impliquée dans un incendie</b>."},
 {q:"L'éthanol se mélange à l'eau (liquide polaire). Quelle mousse et quel dosage choisir s'il prend feu ?",a:"Mousse résistante à l'alcool (AR) à 6 %",w:["Mousse classe A à 0,5 %","Mousse ordinaire pour hydrocarbures à 3 %","Aucune mousse, de l'eau en jet plein"],e:"Liquide <b>polaire</b> = il détruit la mousse ordinaire. On utilise une mousse <b>AR</b> (résistante à l'alcool), en général à <b>6 %</b>. Les hydrocarbures se traitent à 3 %."},
 {q:"Comment approcher les lieux ?",a:"Dos au vent, en amont et en terrain plus élevé",w:["Sous le vent, pour sentir le produit","Par le chemin le plus court","Face au vent, en descendant vers le fossé"],e:"Approche HAZMAT : <b>vent dans le dos</b>, <b>en amont</b> de l'écoulement et sur un <b>terrain plus élevé</b>. Ici, le vent vient de l'ouest : on arrive par l'ouest."}
 ]},
{id:"propane",ic:"🔥",t:"Fuite de propane",d:"Densité de vapeur, détection, plage d'inflammabilité",
 ctx:"Samedi, 18 h. Un restaurant signale une forte odeur de gaz. Une bouteille de propane de 100 lb, installée contre le mur arrière, fuit au niveau du régulateur : on entend un sifflement et du givre se forme sur la valve. Le restaurant a un sous-sol avec des soupiraux près de la bouteille. Les clients ont évacué. Ton détecteur 4 gaz est étalonné au méthane.",
 qs:[
 {q:"Quel est le risque principal du propane (guide 115) ?",a:"Extrêmement inflammable",w:["Corrosif pour la peau","Toxique par inhalation à faible dose","Radioactif"],e:"Guide 115 (gaz inflammables) : risque principal = <b>EXTRÊMEMENT INFLAMMABLE</b>. Le risque principal est écrit en haut à gauche de la page-guide, en gras et en majuscules."},
 {q:"Le propane a une densité de vapeur d'environ 1,5. Qu'est-ce que ça implique ?",a:"Il est plus lourd que l'air et s'accumule dans les points bas",w:["Il monte vers le plafond","Il se mélange à l'eau des drains","Il se dissipe tout seul en quelques secondes"],e:"Densité de vapeur <b>> 1</b> = plus lourd que l'air. Le gaz coule vers les <b>sous-sols, drains, fosses et égouts</b>."},
 {q:"Où mesures-tu en priorité avec le détecteur 4 gaz ?",a:"Au sous-sol, près des soupiraux et des drains, à basse hauteur",w:["Au plafond de la salle à manger","Sur le toit du restaurant","Uniquement à l'extérieur, à 1 m du sol"],e:"On mesure toujours <b>en bas, au milieu et en haut</b>, mais un gaz lourd se cherche d'abord <b>dans les points bas</b> : sous-sol, soupiraux, drains."},
 {q:"La plage d'inflammabilité du propane va d'environ 2,1 % à 9,5 % dans l'air. Laquelle de ces concentrations peut s'enflammer ?",a:"4 %",w:["1 %","12 %","0,5 %"],e:"Entre la <b>LIE</b> (≈ 2,1 %) et la <b>LSE</b> (≈ 9,5 %), le mélange peut s'enflammer. Sous la LIE il est trop pauvre et au-dessus de la LSE trop riche. Mais une zone trop riche redevient inflammable en se diluant."},
 {q:"Ton détecteur est étalonné au méthane, mais le gaz est du propane. Que dois-tu faire avec la lecture LIE ?",a:"La corriger avec le facteur de conversion du fabricant",w:["La lire telle quelle, c'est le même gaz","La diviser par 10","L'ignorer : un détecteur au méthane ne voit pas le propane"],e:"Le capteur réagit différemment selon le gaz. On multiplie la lecture par le <b>facteur de correction</b> de la charte du fabricant pour obtenir la LIE réelle du produit."},
 {q:"Quelle tâche peut empêcher les vapeurs d'atteindre les soupiraux ?",a:"Mettre en place un rideau d'eau pour disperser les vapeurs",w:["Éteindre la flamme pilote avec un jet plein","Ouvrir toutes les fenêtres du sous-sol","Ventiler à pression positive vers la bouteille"],e:"Le <b>rideau d'eau</b> (dispersion des vapeurs) détourne et dilue le nuage de gaz. Il faut connaître le produit avant de s'en servir."},
 {q:"Si une grosse citerne de propane était exposée aux flammes, quels risques pose un BLEVE ?",a:"Boule de feu, onde de choc, projection de fragments et rayonnement thermique",w:["Fumée noire et suie seulement","Contamination radioactive","Réaction violente avec l'eau"],e:"BLEVE = éclatement d'un réservoir de liquide sous pression. Il produit une <b>boule de feu</b>, une <b>onde de surpression</b> et des <b>projectiles</b> (fragments du réservoir) qui peuvent aller très loin, avec un fort <b>rayonnement thermique</b>."}
 ]},
{id:"ipa",ic:"🛢️",t:"Fûts percés en usine",d:"Taille du déversement, LIE réelle, confinement",
 ctx:"Jeudi, 14 h 10. Dans l'entrepôt d'une imprimerie, un chariot élévateur électrique a heurté une palette : deux fûts de 208 L d'alcool isopropylique (NIP 1219, guide 129) sont percés. Le liquide coule vers un drain de plancher. Le cariste a reçu une éclaboussure au visage et se frotte les yeux. Le chariot est resté en marche. Température intérieure : 26 °C.",
 qs:[
 {q:"Deux fûts de 208 L sont percés. Selon le GMU, c'est…",a:"Un grand déversement (plus d'un petit contenant ou plus de 208 L)",w:["Un petit déversement, car chaque fût fait 208 L","Un déversement mineur, car c'est à l'intérieur","Ça dépend seulement de l'heure"],e:"GMU : un <b>petit déversement</b> vient d'un seul petit contenant (jusqu'à 208 L pour un liquide) ou d'une petite fuite d'un grand contenant. Ici, deux fûts : on traite comme un <b>grand déversement</b>."},
 {q:"Quelle est la priorité pour le cariste ?",a:"Rincer les yeux à l'eau courante au moins 20 minutes",w:["Le laisser se reposer dans l'entrepôt","Lui appliquer une compresse sèche","Neutraliser avec un autre produit chimique"],e:"Premiers soins du GMU : en cas de contact avec les yeux, <b>rincer immédiatement à l'eau courante pendant au moins 20 minutes</b>, puis l'évacuer vers les soins."},
 {q:"Ton détecteur, réglé pour l'alcool isopropylique, lit 50 % de la LIE. Sa LIE est d'environ 2 % dans l'air. Quelle est la concentration réelle dans l'air ?",a:"Environ 1 % dans l'air",w:["50 % dans l'air","2 % dans l'air","25 % dans l'air"],e:"La lecture est un <b>% de la LIE</b>, pas un % d'air. 50 % de 2 % = <b>1 % dans l'air</b>. À 50 % de la LIE, on est déjà au-dessus de l'alarme haute : on se retire."},
 {q:"Quelle source d'ignition faut-il gérer en premier ?",a:"Le chariot élévateur électrique resté en marche",w:["La lumière du jour","Le drain de plancher","Les palettes de bois"],e:"On <b>élimine les sources d'ignition</b> : moteurs, contacts électriques, étincelles. Le chariot en marche est la source la plus proche."},
 {q:"Quelle action défensive empêche le produit d'atteindre les égouts ?",a:"Obturer le drain et endiguer avec des boudins",w:["Diluer avec beaucoup d'eau vers le drain","Laisser couler, l'usine nettoiera","Recouvrir le drain avec une bâche seulement après le nettoyage"],e:"On <b>bloque le drain</b> (obturateur, bâche lestée) et on <b>endigue</b>. Diluer vers l'égout ne fait que déplacer le problème."},
 {q:"L'alcool isopropylique se mélange à l'eau. Quel absorbant choisir ?",a:"Un absorbant hydrophile ou universel",w:["Un absorbant hydrophobe seulement","Du sable mouillé","Aucun : on attend que ça s'évapore"],e:"<b>Hydrophobe</b> = repousse l'eau et absorbe les hydrocarbures (huile, essence). <b>Hydrophile / universel</b> = absorbe l'eau et les produits miscibles à l'eau, comme les alcools."},
 {q:"Que fais-tu des absorbants une fois utilisés ?",a:"Ils deviennent une matière dangereuse : on les met en contenant identifié pour élimination",w:["On les jette dans un conteneur ordinaire","On les rince et on les réutilise","On les laisse sécher sur place"],e:"Un absorbant contaminé a les <b>mêmes dangers que le produit</b>. On l'ensache dans un contenant identifié et on le fait éliminer selon la réglementation."}
 ]},
{id:"chlore",ic:"🏊",t:"Centre aquatique",d:"Mélange de produits, gaz toxique, multiples victimes",
 ctx:"Mercredi, 10 h 05. Au centre aquatique municipal, un livreur a versé par erreur de l'acide dans le bac d'hypochlorite de sodium du local de filtration. Un nuage verdâtre à l'odeur piquante sort du local et descend l'escalier vers le vestiaire. Une vingtaine de nageurs toussent, ont les yeux qui piquent et sont regroupés à l'extérieur, encore mouillés. Vent du nord, 10 km/h. Il fait −5 °C.",
 qs:[
 {q:"Pourquoi ce mélange est-il si dangereux ?",a:"Hypochlorite + acide dégage du chlore gazeux, toxique par inhalation",w:["Le mélange devient explosif comme du propane","Le mélange devient radioactif","Il n'y a aucun danger, les deux produits se neutralisent"],e:"Un acide sur de l'hypochlorite libère du <b>chlore gazeux</b>. Son risque principal est la toxicité par inhalation. Il est aussi un oxydant puissant (guide 124)."},
 {q:"Le nuage descend l'escalier. Qu'est-ce que ça t'apprend ?",a:"Le gaz est plus lourd que l'air : il s'accumule dans les parties basses",w:["Le gaz est plus léger que l'air","Le gaz est déjà dilué et sans danger","Le gaz est attiré par l'eau chaude"],e:"Le chlore est environ 2,5 fois plus lourd que l'air. Il remplit les <b>sous-sols et vestiaires</b>, d'où le risque pour les gens qui y resteraient."},
 {q:"Au niveau opération, en tenue de combat avec APRIA, peux-tu entrer dans le local pour fermer le bac ?",a:"Non : stratégie défensive, on isole et on attend les techniciens HAZMAT",w:["Oui, l'APRIA suffit pour tout","Oui, si on y va vite","Oui, en retenant son souffle"],e:"La tenue de combat <b>n'est pas une protection chimique</b>. Contre un gaz toxique et corrosif, l'entrée demande un <b>niveau A</b> et des <b>techniciens</b>. Au niveau opération, on isole, on protège et on agit à distance."},
 {q:"Vingt victimes exposées, mouillées et qui toussent. Quelle décontamination prévoir ?",a:"Une décontamination de masse",w:["Une décontamination technique, une personne à la fois en niveau A","Aucune, la piscine les a déjà rincées","Une décontamination des équipements seulement"],e:"Beaucoup de victimes = <b>décontamination de masse</b> : retirer les vêtements, rincer abondamment, puis abriter et réévaluer (attention au froid à −5 °C : prévoir un abri chauffé)."},
 {q:"Une victime a de la difficulté à respirer et a perdu connaissance. Que fais-tu ?",a:"Air frais et oxygène, sans bouche-à-bouche",w:["Bouche-à-bouche immédiat","La faire marcher pour qu'elle reprenne son souffle","La laisser près du local pour la surveiller"],e:"Premiers soins du GMU : air frais, <b>oxygène</b> si la respiration est difficile, respiration artificielle <b>avec un masque</b>, jamais en bouche-à-bouche (le secouriste se contaminerait)."},
 {q:"Où places-tu le poste de commandement ?",a:"En zone froide, en amont du vent (côté nord)",w:["Sous le vent, côté sud, pour voir le nuage","Dans le hall d'entrée du centre","En zone tiède, près du corridor de décontamination"],e:"Le PC est en <b>zone froide</b>, <b>vent dans le dos</b>. Le vent vient du nord, donc le PC est placé au nord du bâtiment."}
 ]},
{id:"inconnu",ic:"❓",t:"Fût non identifié",d:"Produit inconnu, CANUTEC, protection",
 ctx:"Dimanche, 16 h 30. Derrière un centre commercial, un employé signale un vieux fût métallique couché au pied du quai de chargement. Un liquide huileux jaunâtre s'en échappe lentement. Aucune étiquette, aucun placard, aucun document. L'employé dit avoir eu « mal à la tête » après s'être approché. Pas de flamme ni de vapeur visible. Vent léger du sud-ouest.",
 qs:[
 {q:"Aucun indice ne permet d'identifier le produit. Quel guide utiliser ?",a:"Le guide 111 (marchandises mixtes ou non identifiées)",w:["Le guide 128, comme pour l'essence","Le guide 171","Aucun guide tant qu'on ne connaît pas le produit"],e:"Produit inconnu = <b>guide 111</b>. On l'applique jusqu'à ce que le produit soit identifié."},
 {q:"Parmi les 7 groupes d'indices, lequel t'aide ici ?",a:"Le type de contenant (fût métallique) et les signes perçus par les sens (mal de tête)",w:["Le placard TMD","Le document de transport","La fiche de données de sécurité (FDS)"],e:"Les 7 groupes d'indices : <b>lieu / occupation</b>, <b>forme du contenant</b>, <b>marques et couleurs</b>, <b>placards et étiquettes</b>, <b>documents</b> (transport, FDS), <b>sens</b>, <b>appareils de détection</b>. Ici, il ne reste que le contenant, l'aspect du liquide et le malaise de l'employé."},
 {q:"Pourquoi faut-il se méfier des indices perçus par les sens ?",a:"Pour les percevoir, il faut déjà être exposé au produit",w:["Parce que l'odorat est toujours fiable","Parce que les sens ne servent à rien en HAZMAT","Parce que seul le goût est fiable"],e:"Sentir ou voir de près, c'est déjà être <b>exposé</b>. Certains produits sont inodores ou paralysent l'odorat. Les sens sont le <b>dernier recours</b>."},
 {q:"Comment joindre CANUTEC ?",a:"Au 1-888-CANUTEC (226-8832) ou *666 sur un cellulaire",w:["Au 911 seulement","Par courriel","Au numéro du fabricant uniquement"],e:"CANUTEC (Transports Canada) répond 24 h sur 24 : <b>1-888-226-8832</b>, <b>*666</b> sur cellulaire, ou 613-996-6666."},
 {q:"Pour protéger les gens sur place, quel principe appliques-tu ?",a:"TED : réduire le Temps d'exposition, utiliser un Écran, augmenter la Distance",w:["TED : Toucher, Examiner, Déplacer","Rester près du fût pour le surveiller","Faire sentir le produit à un collègue pour le confirmer"],e:"<b>T</b>emps (exposition la plus courte possible), <b>É</b>cran (un obstacle entre la source et les personnes), <b>D</b>istance (s'éloigner). On évacue et on isole."},
 {q:"Quelle protection pour s'approcher d'un produit inconnu qui cause des symptômes ?",a:"Protection maximale (niveau A) : une tâche de techniciens",w:["Niveau D, l'uniforme de travail","Niveau C, avec un masque à cartouche","Gants de nitrile et lunettes"],e:"Produit <b>inconnu</b> = on présume le pire, donc <b>niveau A</b> (combinaison étanche aux vapeurs + APRIA). Le niveau C exige de connaître le produit et sa concentration."}
 ]},
{id:"labo",ic:"🧪",t:"Laboratoire clandestin",d:"Reconnaître, se retirer, ressources",
 ctx:"Nuit, 2 h 15. Appel pour de la fumée dans un chalet isolé en location. À l'arrivée : fenêtres couvertes de papier d'aluminium, ventilateur bricolé dans une fenêtre, odeur de solvant mêlée d'ammoniac. Par la porte entrouverte, on voit de la verrerie, des tubes, des plaques chauffantes et plusieurs bidons sans étiquette. Ton détecteur sonne à la porte : 22 % de la LIE.",
 qs:[
 {q:"Qu'indiquent ces indices ?",a:"Un probable laboratoire clandestin de drogue",w:["Un atelier de bricolage ordinaire","Une fuite de gaz naturel domestique","Un feu de cheminée"],e:"Fenêtres obstruées, ventilation bricolée, odeurs chimiques, verrerie et bidons sans étiquette : ce sont les signes classiques d'un <b>laboratoire clandestin</b>."},
 {q:"Le détecteur indique 22 % de la LIE à la porte. Que fais-tu ?",a:"Je me retire immédiatement : on a dépassé l'alarme haute",w:["J'entre ventiler rapidement","Je continue, on est loin de 100 %","J'éteins le détecteur qui fait du bruit"],e:"Les alarmes de LIE sont souvent réglées à <b>10 %</b> (basse) et <b>20 %</b> (haute). À 22 %, l'atmosphère est potentiellement explosive : <b>retrait</b>."},
 {q:"Vrai ou faux : on coupe l'électricité du chalet avant d'entrer.",a:"Faux : on ne touche à aucun interrupteur ni à aucune commande",w:["Vrai, c'est toujours la première chose à faire","Vrai, mais seulement le gaz","Faux, on coupe seulement l'eau"],e:"Actionner un interrupteur peut créer une <b>étincelle</b> ou déclencher un <b>piège</b>. On ne touche à rien."},
 {q:"Quelle stratégie adoptes-tu pour l'incendie ?",a:"Défensive ou non-intervention : protéger les expositions sans entrer",w:["Offensive : attaque intérieure rapide","Ventilation verticale immédiate","Recherche primaire dans chaque pièce"],e:"Risque d'explosion, de produits toxiques inconnus, de pièges et d'occupants hostiles : <b>on n'entre pas</b>. On protège les expositions."},
 {q:"Qui dois-tu faire venir en priorité ?",a:"La police (c'est une scène de crime) et l'équipe HAZMAT",w:["Le propriétaire du chalet seulement","Hydro-Québec seulement","Personne, on gère seuls"],e:"Le labo clandestin est une <b>scène de crime</b> : on <b>préserve les preuves</b> et la <b>police</b> prend en charge, avec les techniciens HAZMAT."}
 ]},
{id:"fosse",ic:"🔧",t:"Fosse de garage",d:"Lecture du détecteur 4 gaz",
 ctx:"Lundi, 8 h 20. Un mécanicien est retrouvé inconscient au fond d'une fosse d'entretien. Un véhicule au propane est garé au-dessus, moteur arrêté depuis peu. Au bord de la fosse, ton détecteur 4 gaz affiche :",
 data:"O₂ : 18,9 %   ·   CO : 60 ppm   ·   H₂S : 0 ppm   ·   LIE : 8 %",
 qs:[
 {q:"Comment interprètes-tu le taux d'oxygène à 18,9 % ?",a:"Atmosphère déficiente en oxygène (moins de 19,5 %)",w:["Normal","Enrichie en oxygène","Trop haut pour être mesuré"],e:"L'air contient environ 20,9 % d'O₂. Sous <b>19,5 %</b>, l'atmosphère est <b>déficiente</b>. Une baisse d'O₂ veut aussi dire qu'un autre gaz a pris sa place."},
 {q:"Et le CO à 60 ppm ?",a:"Au-dessus du seuil d'alarme basse habituel (35 ppm) : danger",w:["Normal, c'est sous 100 ppm","Il faudrait plus de 1 000 ppm pour être dangereux","Le CO ne s'applique pas à un garage"],e:"Le seuil d'alarme basse du CO est souvent réglé à <b>35 ppm</b>. Le moteur qui vient de tourner explique ce CO."},
 {q:"Où le gaz s'accumule-t-il le plus ?",a:"Au fond de la fosse : le propane et les vapeurs d'essence sont plus lourds que l'air",w:["Au plafond du garage","Uniformément dans tout le garage","Nulle part, il se dilue tout seul"],e:"Les gaz plus lourds que l'air remplissent les <b>fosses</b>. On mesure <b>en haut, au milieu, puis en bas</b> : la lecture au fond sera probablement pire."},
 {q:"Que fais-tu avant de descendre chercher la victime ?",a:"APRIA, ventilation de la fosse et élimination des sources d'ignition",w:["Je descends tout de suite sans APRIA, c'est urgent","J'attends que la victime remonte seule","Je démarre le véhicule pour le déplacer"],e:"Manque d'O₂ + CO + vapeurs inflammables : <b>APRIA obligatoire</b>. On ventile (sans source d'ignition) et on ne démarre surtout pas le moteur."},
 {q:"Pourquoi allume-t-on et vérifie-t-on le détecteur avant d'arriver sur les lieux ?",a:"Pour faire le zéro et le test de fonctionnement en air propre",w:["Pour économiser la batterie","Ce n'est pas nécessaire","Pour qu'il chauffe et sente mieux"],e:"Le détecteur se met à zéro avec l'air ambiant. Si on l'allume dans une zone contaminée, il prend <b>l'air contaminé comme référence</b> et sous-estime le danger."}
 ]},
{id:"ammoniac",ic:"🚆",t:"Wagon d'ammoniac",d:"Pages vertes, isolement, protection",
 ctx:"Vendredi, 23 h 30. Un wagon-citerne a déraillé dans la cour de triage. Le policier sur place signale un nuage blanc et une odeur très irritante. Il lit « 1005 » sur le panneau orange. Le NIP est surligné dans les pages jaunes du GMU. Vent du nord-est, environ 12 km/h. Un quartier résidentiel se trouve à 1 km au sud-ouest.",
 qs:[
 {q:"Le NIP 1005 (ammoniac anhydre) est surligné. Qu'est-ce que ça veut dire ?",a:"C'est une matière toxique par inhalation : il faut consulter les pages vertes",w:["Le produit est sans danger","Il faut appeler le fabricant avant de lire le guide","Le produit est radioactif"],e:"Un produit <b>surligné</b> est toxique par inhalation (ou dégage un gaz toxique au contact de l'eau). On consulte les <b>pages vertes</b> pour les distances d'isolement et de protection."},
 {q:"Grand déversement d'un wagon, la nuit, vent de 12 km/h. Quel tableau consultes-tu ?",a:"Le tableau 3 (gaz toxiques courants, grands déversements selon le contenant et le vent)",w:["Le tableau 2 (matières hydroréactives)","La page des placards","Seulement le guide orange"],e:"Le <b>tableau 3</b> donne, pour six gaz toxiques courants (ammoniac, chlore…), les distances selon le <b>type de contenant</b>, le <b>moment (jour ou nuit)</b> et la <b>vitesse du vent</b>."},
 {q:"Quelle est la différence entre « isolement initial » et « distance de protection » ?",a:"Isolement = cercle autour du lieu où personne n'entre ; protection = zone sous le vent où on protège la population",w:["C'est la même chose","Isolement = sous le vent ; protection = en amont du vent","Isolement = la nuit ; protection = le jour"],e:"<b>Isolement initial</b> : un cercle dans toutes les directions. <b>Distance de protection</b> : une zone en aval du vent où l'on évacue ou confine la population."},
 {q:"Pourquoi la distance de protection est-elle plus grande la nuit ?",a:"L'air est plus stable la nuit : le nuage se disperse moins",w:["Parce qu'on voit moins bien","Parce que les gens dorment plus profondément","Elle est toujours plus petite la nuit"],e:"La nuit, l'atmosphère est plus <b>stable</b> : le nuage reste concentré et voyage plus loin."},
 {q:"Le vent vient du nord-est. Le quartier est au sud-ouest. Que fais-tu ?",a:"Le quartier est sous le vent : évacuer ou confiner selon les distances du GMU",w:["Rien, il est à 1 km","Évacuer seulement le nord-est","Arroser le nuage au jet plein vers le quartier"],e:"Un vent du nord-est pousse le nuage <b>vers le sud-ouest</b>, donc vers le quartier. On compare 1 km à la distance de protection du tableau 3."},
 {q:"Quelle est la mission de l'équipe de niveau opération ici ?",a:"Isoler, évacuer ou confiner et agir de façon défensive, à distance",w:["Colmater la fuite du wagon","Transvider le wagon","Neutraliser l'ammoniac à l'acide"],e:"Colmater, transvider ou neutraliser sont des actions <b>offensives</b>, réservées aux <b>techniciens</b>. Au niveau opération, on fait du <b>défensif</b>."}
 ]},
{id:"acide",ic:"⚗️",t:"Citerne d'acide",d:"Matières corrosives et hydroréactives",
 ctx:"Mardi, 15 h. Sur la route 175, une citerne routière TC 312 a heurté un muret et fuit par une valve. Placard noir et blanc, classe 8, NIP 1830 (acide sulfurique, guide 137). Une fumée blanche se forme là où le liquide touche les flaques d'eau de pluie.",
 qs:[
 {q:"Que transporte habituellement une citerne TC 312 ?",a:"Des produits corrosifs (acides, bases)",w:["De l'essence et du diesel","Du propane liquéfié","Des gaz cryogéniques"],e:"TC 312 = petite citerne épaisse et solide pour les <b>corrosifs</b>. TC 306/406 = essence et diesel. TC 307/407 = produits chimiques. TC 338 = cryogéniques."},
 {q:"Pourquoi la fumée blanche au contact de l'eau ?",a:"L'acide réagit avec l'eau (guide 137 : matières hydroréactives et corrosives)",w:["C'est de la vapeur sans danger","Le produit est en train de brûler","C'est de la fumée de pneus"],e:"Le guide 137 couvre les matières <b>corrosives qui réagissent avec l'eau</b>. La réaction dégage de la chaleur et des vapeurs."},
 {q:"Peut-on arroser la fuite pour diluer l'acide ?",a:"Non : ne pas mettre d'eau directement sur le produit ni dans le contenant",w:["Oui, toujours au jet plein","Oui, plus il y a d'eau mieux c'est","Oui, mais seulement de l'eau chaude"],e:"La dilution ne marche que si le produit est <b>soluble, ne réagit pas avec l'eau</b> et qu'on peut <b>contenir</b> l'eau de ruissellement. Ici, il réagit avec l'eau : <b>pas d'eau directement</b>."},
 {q:"Quelle action défensive est appropriée ?",a:"Endiguer à distance pour empêcher l'acide d'atteindre les fossés et les égouts",w:["Fermer la valve à mains nues","Neutraliser avec de l'eau de javel","Ouvrir les autres valves pour vider plus vite"],e:"<b>Endiguer, détourner, retenir</b> : ce sont des actions défensives, faites à distance. La neutralisation, c'est le travail des techniciens."},
 {q:"Vrai ou faux : la tenue de combat protège contre les éclaboussures d'acide sulfurique.",a:"Faux : elle n'offre qu'une protection très limitée contre les produits chimiques",w:["Vrai, elle est conçue pour ça","Vrai, si elle est mouillée","Vrai, mais seulement les bottes"],e:"La tenue de combat se <b>contamine</b> et ne protège pas contre les corrosifs. On évite tout contact : pas de genou au sol, pas de produit touché."}
 ]},
{id:"lithium",ic:"🔋",t:"Remorque de batteries",d:"Classe 9, guide, contrôle de l'incendie",
 ctx:"Jeudi, 11 h. Un camion de livraison est immobilisé sur l'accotement : de la fumée sort de la remorque. Le placard est rayé noir et blanc dans la moitié du haut, avec une rangée de piles. Le document de transport, trouvé dans la cabine, indique « UN3480, piles au lithium ionique ».",
 qs:[
 {q:"À quelle classe correspond le placard rayé noir et blanc ?",a:"Classe 9 : matières et objets dangereux divers",w:["Classe 8 : corrosifs","Classe 4.1 : solides inflammables","Classe 6.1 : toxiques"],e:"Classe 9 = <b>divers</b>. Un placard à bandes noires verticales dans le haut, avec le symbole des piles pour le lithium."},
 {q:"Où se trouve le document de transport d'un camion ?",a:"Dans la cabine, à portée du conducteur",w:["Dans la remorque, avec la marchandise","Chez le répartiteur seulement","Collé sur le pare-chocs"],e:"Routier : <b>cabine</b>, à portée du conducteur. Ferroviaire : avec l'équipage. Maritime : à la passerelle. Aérien : avec le commandant de bord."},
 {q:"Quel guide utiliser pour le UN3480 ?",a:"Le guide 147",w:["Le guide 111","Le guide 128","Le guide 115"],e:"Les piles au lithium ionique renvoient au <b>guide 147</b>."},
 {q:"Parmi les 4 façons de traiter un incendie de matière dangereuse, laquelle n'en est PAS une ?",a:"Ventiler à pression positive dans la remorque",w:["Éteindre","Laisser brûler de façon contrôlée en protégeant les expositions","Couper l'alimentation en combustible (retirer le produit)"],e:"Les options : <b>éteindre</b>, <b>laisser brûler</b> (en protégeant les expositions), <b>refroidir / protéger les expositions</b> et <b>couper l'alimentation</b>. On choisit selon le produit et les risques."},
 {q:"Les piles peuvent se rallumer après avoir été éteintes. Que dois-tu prévoir ?",a:"Une surveillance prolongée et un refroidissement continu",w:["Partir dès que la fumée cesse","Ouvrir la remorque et retirer les piles à la main","Couvrir de neige et partir"],e:"Les piles au lithium peuvent faire un <b>emballement thermique</b> et se rallumer : on refroidit longtemps et on <b>surveille</b>."}
 ]}
];

const THEMES=[
{id:"c12",ic:"📚",ch:"Cours 1-2",t:"Bases et APIE",d:"Niveaux, lois, APIE, indices, contenants",qs:[
 {q:"Quels sont les 4 niveaux de compétence HAZMAT de la NFPA, du plus bas au plus haut ?",a:"Sensibilisation, opération, technicien, spécialiste",w:["Opération, sensibilisation, spécialiste, technicien","Débutant, intermédiaire, avancé, expert","Pompier, officier, chef, directeur"],e:"<b>Sensibilisation → Opération → Technicien → Spécialiste</b>. Ce module vise le niveau <b>opération</b>."},
 {q:"Au niveau opération, le pompier fait principalement des actions…",a:"Défensives, sans contact direct avec le produit",w:["Offensives, comme colmater une fuite","De neutralisation chimique","De transvidement de citernes"],e:"Niveau opération : protéger les personnes, l'environnement et les biens par des actions <b>défensives</b> (isoler, endiguer, détourner, supprimer les vapeurs)."},
 {q:"Sur quel système la CNESST s'appuie-t-elle pour classer les matières dangereuses en milieu de travail ?",a:"Le SIMDUT",w:["La NFPA 704","Le code Kemler","Le GMU"],e:"Le <b>SIMDUT</b> (Système d'information sur les matières dangereuses utilisées au travail) encadre les étiquettes et les fiches de données de sécurité (FDS)."},
 {q:"Vrai ou faux : la NFPA 704 est la norme légale qui encadre les matières dangereuses au Québec.",a:"Faux : c'est une norme américaine d'usage volontaire",w:["Vrai, elle est obligatoire partout","Vrai, mais seulement pour le transport","Vrai, elle remplace le SIMDUT"],e:"Le losange NFPA 704 se voit souvent sur les bâtiments, mais au Québec, ce qui encadre la loi, c'est le <b>SIMDUT</b> (milieu de travail) et le <b>TMD</b> (transport)."},
 {q:"Que signifie APIE ?",a:"Analyser, Planifier, Intervenir, Évaluer",w:["Arriver, Protéger, Isoler, Évacuer","Alerter, Prévenir, Identifier, Éteindre","Analyser, Protéger, Isoler, Extinguer"],e:"Le modèle <b>APIE</b> : <b>A</b>nalyser la situation, <b>P</b>lanifier la réponse, <b>I</b>ntervenir (mettre en œuvre), <b>É</b>valuer les progrès."},
 {q:"À quelle étape de l'APIE détermine-t-on les zones et choisit-on les EPI ?",a:"Planifier",w:["Analyser","Intervenir","Évaluer"],e:"<b>Planifier</b> : objectifs, options défensives, zones chaude, tiède et froide, EPI, décontamination."},
 {q:"À l'étape « Évaluer », on vérifie notamment que…",a:"Les personnes sont en sécurité, le danger est maîtrisé, le site est sécurisé et les preuves sont conservées",w:["Le camion est prêt à repartir","Le rapport est imprimé","Les médias ont été avisés"],e:"Évaluer : <b>personnes en sécurité</b>, <b>danger maîtrisé</b>, <b>site sécurisé</b>, <b>preuves conservées</b>. Si ce n'est pas le cas, on revient à la planification."},
 {q:"Quels sont les 3 objectifs d'une intervention HAZMAT, dans l'ordre de priorité ?",a:"Protéger la vie, l'environnement, puis les biens",w:["Les biens, l'environnement, la vie","Éteindre, nettoyer, partir","L'environnement, la vie, les biens"],e:"Priorités : <b>vie</b>, <b>environnement</b>, <b>biens</b>."},
 {q:"Lequel n'est PAS un des 7 groupes d'indices ?",a:"La couleur du camion de pompier",w:["Le lieu et l'occupation","La forme du contenant","Les appareils de détection"],e:"Les 7 groupes : lieu / occupation · forme du contenant · marques et couleurs · placards et étiquettes · documents · sens · appareils de détection."},
 {q:"Une citerne-cylindre d'une tonne (couchée) a deux robinets. À quoi servent-ils ?",a:"Celui du haut donne la phase gazeuse, celui du bas la phase liquide",w:["Les deux donnent du liquide","L'un sert à l'entrée d'eau, l'autre à la sortie","L'un sert de soupape de sûreté, l'autre de jauge"],e:"Robinet du <b>haut = gaz</b>, robinet du <b>bas = liquide</b>. Une fuite liquide est beaucoup plus grave : 1 L de liquide produit beaucoup de gaz."},
 {q:"À quoi sert un récipient Dewar ?",a:"À contenir des liquides cryogéniques (ex. azote liquide)",w:["À transporter de l'essence","À stocker des explosifs","À contenir des acides"],e:"Le <b>Dewar</b> est un contenant isolé sous vide pour les liquides <b>cryogéniques</b>, très froids."},
 {q:"Quel colis radioactif ne porte pas d'étiquette de catégorie ?",a:"Le colis excepté : il contient une très petite quantité",w:["Le colis de type B","Le colis de type A","Le colis industriel"],e:"Le colis <b>excepté</b> contient si peu de matière que le risque est minime : il n'a pas d'étiquette de catégorie. Types de colis : excepté, industriel, A, B, C."},
 {q:"Une citerne MC 331 ou une remorque multitubes transporte généralement…",a:"Des gaz sous pression",w:["Des liquides inflammables non pressurisés","Des solides en vrac","Des corrosifs"],e:"Les citernes à <b>extrémités arrondies</b> et les <b>remorques multitubes</b> sont des contenants sous pression (gaz liquéfiés ou comprimés)."},
 {q:"Une citerne TC 306/406 de forme ovale transporte surtout…",a:"De l'essence, du diesel et d'autres liquides inflammables",w:["Du propane","De l'azote liquide","De l'acide sulfurique"],e:"TC 306/406 = citerne ovale non pressurisée pour les <b>liquides inflammables et combustibles</b>."}
]},
{id:"c3",ic:"🏷️",ch:"Cours 3",t:"Classes et marquages",d:"TMD, NFPA 704, Kemler, références",qs:[
 {q:"Combien de classes de matières dangereuses compte le TMD ?",a:"9",w:["6","4","12"],e:"<b>9 classes</b> : 1 explosifs · 2 gaz · 3 liquides inflammables · 4 solides inflammables · 5 comburants et peroxydes · 6 toxiques et infectieux · 7 radioactifs · 8 corrosifs · 9 divers."},
 {q:"Un placard bleu avec une flamme et le chiffre 4 indique…",a:"Classe 4.3 : matière dangereuse au contact de l'eau",w:["Classe 4.1 : solide inflammable","Classe 2.2 : gaz non inflammable","Classe 5.1 : comburant"],e:"Bleu, classe 4 = <b>4.3, hydroréactif</b> (dégage un gaz inflammable au contact de l'eau). La classe 4.1 est rayée rouge et blanc, la 4.2 est blanche et rouge."},
 {q:"Un placard jaune avec une flamme au-dessus d'un cercle indique…",a:"Classe 5.1 : comburant",w:["Classe 3 : liquide inflammable","Classe 7 : radioactif","Classe 2.1 : gaz inflammable"],e:"La <b>flamme sur un cercle</b>, sur fond jaune = <b>comburant (5.1)</b>. Il alimente la combustion."},
 {q:"Un explosif 1.5 est-il plus dangereux à manipuler qu'un 1.1 ?",a:"Non : la division 1.5 est très peu sensible",w:["Oui, plus le chiffre est élevé, plus c'est dangereux","Oui, c'est toujours le cas","Les deux sont identiques"],e:"La 1.1 a un risque d'explosion en masse. La 1.5 aussi, mais elle est <b>très peu sensible</b> (difficile à amorcer)."},
 {q:"Dans le losange NFPA 704, que représente le carré bleu ?",a:"Le danger pour la santé",w:["L'inflammabilité","L'instabilité / réactivité","Les dangers particuliers"],e:"<b>Bleu</b> = santé · <b>rouge</b> = inflammabilité · <b>jaune</b> = instabilité · <b>blanc</b> = dangers particuliers. Échelle de 0 à 4."},
 {q:"Dans la case blanche du NFPA 704, un « W » barré signifie…",a:"Réagit avec l'eau : ne pas utiliser d'eau",w:["Contient de l'eau","Produit soluble dans l'eau","Avertissement général (warning)"],e:"<b>W barré</b> = réaction dangereuse avec l'eau. OX = comburant, COR = corrosif, CRY = cryogénique."},
 {q:"Code Kemler : que signifie le X devant le code de danger (ex. X423) ?",a:"Ne jamais mettre d'eau : le produit réagit dangereusement avec l'eau",w:["Produit explosif","Produit inconnu","Code annulé"],e:"Le <b>X</b> devant le code de danger = <b>réaction dangereuse avec l'eau</b>."},
 {q:"Code Kemler : que signifie un chiffre doublé (ex. 33, 88) ?",a:"Une intensification du danger",w:["Deux produits différents","Une quantité double","Que le panneau est en double"],e:"Le chiffre doublé indique un danger <b>plus intense</b> (33 = liquide très inflammable, 88 = très corrosif)."},
 {q:"Quelles sont les 3 sources de référence à utiliser sur les lieux ?",a:"Le GMU, la fiche de données de sécurité (FDS) et CANUTEC",w:["Internet, les médias et les témoins","Le plan d'intervention, Google et la police","Le manuel du camion, le GPS et la radio"],e:"<b>GMU</b> (premières 30 minutes), <b>FDS</b> (16 sections, souvent sur place) et <b>CANUTEC</b> (experts joignables 24 h sur 24)."},
 {q:"Sur le panneau d'un pipeline, quelle information doit absolument figurer ?",a:"Le produit transporté, le nom de l'exploitant et un numéro d'urgence",w:["La pression et le diamètre","La date d'installation","Le nom de la municipalité"],e:"On cherche le <b>produit</b>, l'<b>exploitant</b> et le <b>numéro de téléphone d'urgence</b>, pour faire fermer les vannes à distance."},
 {q:"Quelle est la particularité d'une bouteille d'acétylène ?",a:"Elle contient une masse poreuse imbibée d'acétone ; elle doit rester debout",w:["Elle contient de l'oxygène pur","Elle n'a pas de robinet","Elle est faite de plastique"],e:"L'acétylène est <b>dissous dans l'acétone</b>, dans une <b>masse poreuse</b>. Une bouteille couchée peut laisser fuir de l'acétone. Une bouteille chauffée peut se décomposer même après le feu : on la refroidit longtemps."},
 {q:"Où lit-on l'indice de transport d'un colis radioactif ?",a:"Sur l'étiquette jaune de catégorie II ou III",w:["Sur l'étiquette blanche de catégorie I","Sur le document de facturation","Sur le fond du colis"],e:"L'<b>indice de transport</b> figure sur les étiquettes jaunes (catégorie II ou III). Il indique l'intensité de rayonnement à 1 m. On le transmet à CANUTEC."},
 {q:"Ton détecteur réglé pour le méthanol affiche 40 % de la LIE. La LIE du méthanol est d'environ 6 %. Quelle est la concentration dans l'air ?",a:"Environ 2,4 % dans l'air",w:["40 % dans l'air","6 % dans l'air","0,4 % dans l'air"],e:"40 % × 6 % = <b>2,4 % dans l'air</b>. La lecture LIE est toujours un pourcentage de la limite, pas de l'air."},
 {q:"Ton détecteur est étalonné au pentane et affiche 12 %. La charte du fabricant donne un facteur de 1,5 pour ton produit. Quelle est la LIE réelle ?",a:"18 % de la LIE",w:["8 % de la LIE","12 % de la LIE","13,5 % de la LIE"],e:"LIE réelle = lecture × facteur = 12 × 1,5 = <b>18 %</b>. On dépasse l'alarme basse (10 %)."},
 {q:"Quels sont les 4 gaz mesurés par un détecteur 4 gaz standard ?",a:"O₂, LIE (gaz combustibles), CO et H₂S",w:["O₂, CO₂, N₂ et H₂","Chlore, ammoniac, propane et méthane","O₂, CO, NH₃ et HCl"],e:"<b>O₂</b> (manque ou excès), <b>LIE</b> (atmosphère explosive), <b>CO</b> et <b>H₂S</b> (toxiques)."}
]},
{id:"c4",ic:"🛡️",ch:"Cours 4",t:"Gestion et protection",d:"Niveaux d'incident, exposition, EPI, zones, contrôle",qs:[
 {q:"Un incident de niveau 1, c'est…",a:"Un petit incident que le service local peut gérer (ex. petit déversement de carburant)",w:["Un incident qui exige l'évacuation d'une ville","Un incident qui demande plusieurs agences gouvernementales","Un incident terroriste"],e:"Niveau 1 = <b>local</b>. Niveau 2 = demande une <b>équipe HAZMAT</b>, avec une évacuation limitée. Niveau 3 = <b>majeur</b> : ressources multiples, gouvernements, grande évacuation."},
 {q:"Quelle information est la plus utile à obtenir dès la réception de l'appel ?",a:"Le produit (ou ses indices), la quantité, le nombre de victimes et la direction du vent",w:["Le nom de l'assureur","La marque du véhicule","Le nom du propriétaire seulement"],e:"Ces informations permettent de prévoir l'<b>approche</b>, les <b>ressources</b> et les <b>distances</b> avant même d'arriver."},
 {q:"Qu'est-ce que la contamination secondaire ?",a:"La contamination transmise par une personne ou un objet déjà contaminé",w:["Le contact direct avec le produit","La deuxième fuite d'un même contenant","La contamination de l'eau seulement"],e:"<b>Primaire</b> = contact direct avec le produit. <b>Secondaire</b> = transfert à partir d'une personne, d'un équipement ou d'un objet contaminé. La décontamination sert à l'empêcher."},
 {q:"Que veut dire DIVS ?",a:"Danger immédiat pour la vie ou la santé",w:["Dose individuelle de valeur sécuritaire","Distance d'isolement de victimes","Dose infectieuse variable"],e:"<b>DIVS</b> : concentration à partir de laquelle une exposition peut tuer ou causer des effets graves et permanents."},
 {q:"Que veut dire VEMP ?",a:"Valeur d'exposition moyenne pondérée (sur 8 h)",w:["Valeur d'exposition maximale permise","Vitesse d'évaporation moyenne du produit","Volume d'émission maximal permis"],e:"<b>VEMP</b> : moyenne sur une journée de travail de 8 h. <b>VECD</b> : valeur d'exposition de courte durée (15 min). <b>Plafond</b> : ne jamais dépasser."},
 {q:"Que veut dire CL50 ?",a:"La concentration dans l'air qui tue 50 % des sujets exposés",w:["Une concentration limite de 50 ppm","Une classe de liquide de 50 °C","Un code de localisation à 50 m"],e:"<b>CL50</b> = concentration létale 50 % (par inhalation). <b>DL50</b> = dose létale 50 % (ingestion ou contact avec la peau)."},
 {q:"Le niveau de protection A, c'est…",a:"Une combinaison totalement encapsulée et étanche aux vapeurs, avec APRIA",w:["Un APRIA et une combinaison anti-éclaboussures","Un masque à cartouche","L'uniforme de travail"],e:"<b>A</b> : étanche aux vapeurs + APRIA. <b>B</b> : APRIA + anti-éclaboussures. <b>C</b> : masque à cartouche (produit connu). <b>D</b> : uniforme."},
 {q:"Quand le niveau C est-il acceptable ?",a:"Quand le produit et sa concentration sont connus, avec assez d'oxygène",w:["Pour tout produit inconnu","Dans une atmosphère pauvre en oxygène","Quand on manque d'APRIA"],e:"Le masque à cartouche <b>filtre</b> l'air sans fournir d'oxygène : il faut connaître le produit, et l'O₂ doit être suffisant."},
 {q:"Endiguer un déversement est une action…",a:"Défensive",w:["Offensive","De non-intervention","Technique réservée aux spécialistes"],e:"Endiguer, détourner, retenir, absorber, supprimer les vapeurs, éliminer les sources d'ignition = <b>défensif</b>. Colmater ou boucher la fuite = <b>offensif</b>."},
 {q:"Colmater une fuite directement sur le contenant est une action…",a:"Offensive",w:["Défensive","De non-intervention","Faisable en tenue de combat seulement"],e:"Il faut entrer en contact avec le produit : c'est <b>offensif</b>, donc une tâche de <b>technicien</b>."},
 {q:"Dans quelle zone installe-t-on le corridor de décontamination ?",a:"La zone tiède",w:["La zone chaude","La zone froide","Il n'y a pas de zone pour ça"],e:"<b>Chaude</b> (rouge) : exclusion, là où est le produit. <b>Tiède</b> (jaune) : réduction de la contamination, avec le corridor de décon. <b>Froide</b> (verte) : soutien, PC, ressources."},
 {q:"Pour quel produit utilise-t-on un absorbant hydrophobe ?",a:"Un hydrocarbure (huile, essence, diesel)",w:["Un acide dilué dans l'eau","De l'alcool","De l'antigel"],e:"<b>Hydrophobe</b> = repousse l'eau et absorbe les huiles. Utile sur un plan d'eau : il flotte et capte l'hydrocarbure sans se gorger d'eau."},
 {q:"À quelles conditions peut-on utiliser la dilution ?",a:"Produit soluble dans l'eau, sans réaction avec l'eau, et eau de ruissellement contenue",w:["Toujours, c'est la méthode la plus simple","Seulement pour les hydrocarbures","Seulement la nuit"],e:"La dilution réduit la concentration, mais <b>augmente le volume</b>. Elle n'est acceptable que pour un produit <b>soluble</b>, <b>non réactif</b> avec l'eau, et si on peut <b>contenir</b> l'eau."},
 {q:"Une fuite de gaz naturel est enflammée à la sortie d'une conduite. Que fait-on ?",a:"On laisse brûler en protégeant les expositions jusqu'à la fermeture de l'alimentation",w:["On éteint la flamme immédiatement au jet","On l'étouffe avec de la mousse","On bouche la conduite avec une bâche"],e:"Éteindre sans fermer la fuite = un nuage de gaz qui peut <b>exploser</b>. On <b>laisse brûler</b>, on <b>protège les expositions</b> et on fait <b>fermer la vanne</b>."}
]},
{id:"c5",ic:"🧯",ch:"Cours 5",t:"Mousse et décontamination",d:"Classe B, dosage, foisonnement, décon",qs:[
 {q:"Quelle classe de mousse utilise-t-on sur un feu de liquide inflammable ?",a:"Classe B",w:["Classe A","Classe C","Classe D"],e:"<b>Classe B</b> = liquides inflammables. La classe A sert aux combustibles ordinaires (bois, papier)."},
 {q:"Comment la mousse agit-elle sur un feu ?",a:"Elle étouffe, sépare le combustible des vapeurs et refroidit",w:["Elle souffle la flamme","Elle produit une réaction chimique qui neutralise le produit","Elle absorbe le liquide"],e:"<b>Étouffement</b> (prive d'oxygène), <b>séparation</b> (supprime les vapeurs) et <b>refroidissement</b> (l'eau contenue dans la mousse)."},
 {q:"Combien de litres d'émulseur faut-il pour 2 000 L de solution moussante à 3 % ?",a:"60 L",w:["6 L","600 L","30 L"],e:"2 000 L × 3 % = <b>60 L</b> d'émulseur (et 1 940 L d'eau)."},
 {q:"Combien de litres d'émulseur faut-il pour 500 L de solution à 6 % ?",a:"30 L",w:["3 L","60 L","300 L"],e:"500 × 0,06 = <b>30 L</b>."},
 {q:"Quel appareil dose l'émulseur dans la ligne ?",a:"Le proportionneur (éducteur) en ligne",w:["Le diviseur","La lance à jet plein","Le raccord siamois"],e:"Le <b>proportionneur en ligne</b> aspire l'émulseur au bon pourcentage. Il faut respecter la pression et la longueur de boyau prévues par le fabricant, sinon le dosage est faussé."},
 {q:"Une mousse à bas foisonnement a un rapport air / solution d'environ…",a:"Jusqu'à 20 pour 1",w:["De 200 à 1 000 pour 1","De 20 à 200 pour 1","1 pour 1"],e:"<b>Bas</b> : jusqu'à 20:1 · <b>moyen</b> : 20:1 à 200:1 · <b>haut</b> : 200:1 à 1 000:1."},
 {q:"Quelles sont les 3 méthodes d'application de la mousse ?",a:"Roulement (rebond au sol), déflexion (sur une paroi) et pluie",w:["Jet plein, brouillard et vapeur","Directe, indirecte et combinée","Horizontale, verticale et circulaire"],e:"On applique la mousse <b>doucement</b> : en la faisant rouler sur le sol devant le feu, en la faisant glisser sur une paroi ou en la laissant tomber en pluie. Jamais en plongeant dans le liquide."},
 {q:"Vrai ou faux : une fois le tapis de mousse formé, on peut marcher dessus.",a:"Faux : on briserait le tapis et les vapeurs s'échapperaient",w:["Vrai, il est solide","Vrai, si on porte des bottes","Vrai, après 5 minutes"],e:"Marcher sur le tapis le <b>brise</b> : les vapeurs se libèrent et le feu peut repartir. De plus, on marche dans le produit."},
 {q:"Quel est l'objectif de la décontamination ?",a:"Retirer ou réduire le contaminant et empêcher sa propagation",w:["Laver l'équipement pour qu'il soit beau","Remplacer le rapport d'intervention","Neutraliser l'incendie"],e:"Elle protège les victimes et les intervenants, et empêche la <b>contamination secondaire</b> hors de la zone."},
 {q:"Avec quoi fait-on une décontamination d'urgence ?",a:"Avec une ligne d'attaque en jet diffusé, à basse pression, et beaucoup d'eau",w:["Avec une brosse et du savon seulement","Avec un jet plein à haute pression","Avec un produit neutralisant"],e:"Décon d'urgence = <b>rapide</b> : retirer les vêtements et rincer abondamment avec de l'eau à <b>basse pression</b> (jet diffusé), pour ne pas blesser la peau ni faire pénétrer le produit."},
 {q:"Lors d'une décon d'urgence, faut-il d'abord récupérer l'eau de ruissellement ?",a:"Non : la vie passe en premier, on contient l'eau dès qu'on peut",w:["Oui, toujours avant de rincer qui que ce soit","Oui, sinon c'est illégal","Non, l'eau de ruissellement n'est jamais contaminée"],e:"Priorité à la <b>vie</b>. On essaie ensuite de contenir l'eau (bâche, digue), mais ça ne doit jamais retarder le rinçage d'une victime."},
 {q:"Quelles sont les étapes d'une décontamination de masse ?",a:"Retirer les vêtements, rincer abondamment, puis couvrir et réévaluer",w:["Rincer, attendre, rentrer chez soi","Interroger, photographier, rincer","Neutraliser, frotter, sécher au soleil"],e:"<b>Déshabillage</b> (retire une grande partie du contaminant), <b>rinçage</b> (par exemple entre deux autopompes en jet diffusé), puis <b>abri, vêtements de rechange et triage</b>."},
 {q:"Lors d'un acte terroriste, qui dirige l'ensemble de l'intervention ?",a:"La police : c'est une scène de crime",w:["Le premier pompier arrivé","Les ambulanciers","Le propriétaire des lieux"],e:"Les pompiers gèrent leur volet (sauvetage, matières dangereuses), mais la <b>police</b> commande, et il faut <b>préserver les preuves</b>."}
]},
{id:"c6",ic:"🚨",ch:"Cours 6",t:"Labos clandestins et terrorisme",d:"Signes, risques, toxiques létaux",qs:[
 {q:"Lequel est un signe d'un laboratoire clandestin ?",a:"Fenêtres masquées, odeurs chimiques et verrerie de laboratoire dans une résidence",w:["Une odeur de pain frais","Un détecteur de fumée qui fonctionne","Un compteur électrique ordinaire"],e:"Signes : fenêtres <b>obstruées</b>, odeurs de <b>solvant, d'ammoniac ou d'ail</b>, <b>verrerie</b>, contenants <b>sans étiquette</b>, ventilation inhabituelle, va-et-vient."},
 {q:"Quel est un risque particulier pour les pompiers dans un labo clandestin ?",a:"Des pièges, des occupants armés et des atmosphères explosives ou toxiques",w:["Aucun, les produits sont domestiques","Seulement le risque de chute","Seulement le bruit"],e:"<b>Explosion</b>, <b>vapeurs toxiques</b>, <b>pièges</b>, <b>armes</b>, contamination des EPI."},
 {q:"Que fais-tu à la découverte d'un laboratoire clandestin ?",a:"Ne rien toucher, se retirer, isoler et aviser la police",w:["Fermer les plaques chauffantes","Ramasser les bidons pour les sortir","Goûter les poudres pour les identifier"],e:"<b>Ne rien toucher</b>, <b>se retirer</b> par le même chemin, <b>isoler</b>, <b>aviser la police</b> et l'équipe HAZMAT."},
 {q:"Quelle est la différence entre terrorisme domestique et international ?",a:"Domestique : par des gens du pays ; international : par un groupe étranger ou lié à l'étranger",w:["Domestique : dans une maison ; international : dans un aéroport","Domestique : sans victime ; international : avec victimes","Il n'y a aucune différence"],e:"La différence porte sur l'<b>origine</b> des auteurs, pas sur le lieu ni sur la gravité."},
 {q:"Quels sont les 4 grands types de menaces terroristes ?",a:"Chimique, biologique, radiologique ou nucléaire, et explosive",w:["Feu, eau, air, terre","Vol, fraude, vandalisme, incendie","Bruit, lumière, chaleur, froid"],e:"On parle de menaces <b>CBRNE</b> : chimique, biologique, radiologique / nucléaire, explosif."},
 {q:"Quelle famille de toxiques de guerre comprend le chlore et le phosgène ?",a:"Les suffocants",w:["Les vésicants","Les neurotoxiques","Les toxiques généraux"],e:"<b>Suffocants</b> : atteinte des poumons (chlore, phosgène, avec une odeur de foin coupé pour le phosgène)."},
 {q:"Quelle famille provoque des cloques sur la peau (ex. gaz moutarde) ?",a:"Les vésicants",w:["Les suffocants","Les neurotoxiques","Les toxiques généraux"],e:"<b>Vésicants</b> : cloques et brûlures (gaz moutarde, à l'odeur d'ail ou de moutarde)."},
 {q:"Le sarin appartient à quelle famille ?",a:"Les neurotoxiques",w:["Les vésicants","Les suffocants","Les toxiques généraux"],e:"<b>Neurotoxiques</b> (sarin, VX) : ils attaquent le système nerveux. Souvent presque sans odeur."},
 {q:"Pourquoi ne jamais faire de bouche-à-bouche à une victime d'un toxique général (ex. cyanure) ?",a:"Le secouriste se contaminerait",w:["Ça ne sert à rien pour ce type de victime","C'est interdit par la police","La victime pourrait mordre"],e:"Le produit est dans les voies respiratoires de la victime : on utilise un <b>masque</b> ou un ballon-masque, avec oxygène."},
 {q:"Quel signe peut indiquer une attaque terroriste ?",a:"Plusieurs victimes avec les mêmes symptômes, sans cause évidente",w:["Un seul patient avec une entorse","Une panne de courant planifiée","Un feu de poubelle"],e:"Signes : <b>plusieurs victimes aux symptômes identiques</b>, animaux morts, dispositifs ou contenants suspects, odeurs inhabituelles, un lieu symbolique."},
 {q:"Que faut-il craindre en particulier sur une scène terroriste ?",a:"Un deuxième engin visant les secouristes",w:["Que les médias arrivent","Le manque d'eau","Les bouchons de circulation"],e:"Le <b>deuxième engin</b> (dispositif secondaire) vise les intervenants : on regarde avant d'avancer, on évite de se regrouper et on varie les points de rassemblement."}
]},
{id:"gmu",ic:"📙",ch:"GMU 2024",t:"Guide des mesures d'urgence",d:"Pages jaunes, bleues, orange, vertes",qs:[
 {q:"À quoi servent les pages jaunes du GMU ?",a:"À trouver le guide à partir du NIP (numéro ONU)",w:["À trouver le guide à partir du nom du produit","À donner les distances d'isolement","À identifier les placards"],e:"<b>Jaunes</b> = par NIP · <b>bleues</b> = par nom · <b>orange</b> = guides (mesures d'urgence) · <b>vertes</b> = distances d'isolement et de protection."},
 {q:"À quoi servent les pages bleues ?",a:"À trouver le NIP et le guide à partir du nom du produit",w:["À trouver les premiers soins","À calculer les distances la nuit","Aux matières radioactives seulement"],e:"Pages <b>bleues</b> = ordre <b>alphabétique</b> des noms de produits."},
 {q:"Que signifie la lettre « P » après un numéro de guide (ex. 131P) ?",a:"Le produit peut polymériser violemment s'il est chauffé ou contaminé",w:["Le produit est un poison","Le produit est pressurisé","Le produit est permis"],e:"<b>P</b> = risque de <b>polymérisation</b> : une réaction qui s'emballe et peut faire éclater le contenant."},
 {q:"Que contient le tableau 2 des pages vertes ?",a:"Les matières qui dégagent un gaz toxique au contact de l'eau, et le gaz produit",w:["Les distances pour les petits déversements","La liste des placards","Les numéros de CANUTEC"],e:"<b>Tableau 1</b> : distances d'isolement et de protection. <b>Tableau 2</b> : matières hydroréactives et gaz toxiques dégagés. <b>Tableau 3</b> : grands déversements de six gaz toxiques courants."},
 {q:"Un produit inconnu fuit. Quel guide ?",a:"111",w:["128","171","153"],e:"<b>Guide 111</b> : marchandises mixtes ou non identifiées."},
 {q:"Tu vois un placard de classe 3 (liquide inflammable), sans NIP. Quel guide utiliser par défaut ?",a:"127",w:["111","115","153"],e:"La page des placards du GMU renvoie le placard « liquide inflammable » au <b>guide 127</b>, en attendant d'identifier le produit."},
 {q:"Où est écrit le risque principal sur une page-guide orange ?",a:"En haut, en gras et en majuscules (incendie ou explosion / santé)",w:["Au bas de la deuxième page","Dans les pages vertes seulement","Sur la couverture du GMU"],e:"La section du haut (<b>RISQUES POTENTIELS</b>) commence par le risque principal, en <b>majuscules et en gras</b> : soit Incendie ou explosion, soit Santé en premier."},
 {q:"Le GMU est conçu pour guider les intervenants pendant…",a:"La phase initiale (environ les 30 premières minutes)",w:["Toute l'intervention, jusqu'au nettoyage","La rédaction du rapport","Le transport vers l'hôpital"],e:"Le GMU guide les <b>premières minutes</b>. Ensuite, on se fie à la FDS, à CANUTEC, à l'expéditeur et aux techniciens."},
 {q:"L'essence (NIP 1203), le diesel (NIP 1202) : quel guide ?",a:"128",w:["127","115","131"],e:"<b>Guide 128</b> : liquides inflammables (non polaires, non miscibles à l'eau)."},
 {q:"Pour une citerne de liquide inflammable impliquée dans un incendie (guides 127/128), quel isolement le GMU recommande-t-il ?",a:"800 m dans toutes les directions",w:["50 m","100 m","25 m"],e:"Citerne, wagon ou camion-citerne <b>impliqué dans un incendie</b> : isoler sur <b>800 m</b> et envisager une évacuation initiale sur 800 m."},
 {q:"Le chlore (NIP 1017) renvoie à quel guide ?",a:"124",w:["125","137","154"],e:"<b>Guide 124</b> : gaz toxiques et/ou corrosifs, comburants. L'ammoniac anhydre (1005), lui, renvoie au guide 125."},
 {q:"L'hypochlorite de sodium en solution (NIP 1791) renvoie à quel guide ?",a:"154",w:["124","137","111"],e:"<b>Guide 154</b> : matières toxiques et/ou corrosives (non combustibles)."},
 {q:"Le trichlorosilane réagit avec l'eau. Où trouves-tu le gaz toxique qu'il dégage ?",a:"Dans le tableau 2 des pages vertes",w:["Dans les pages bleues","Dans le tableau 3","Sur le placard"],e:"<b>Tableau 2</b> : liste les matières hydroréactives et le gaz dégagé (ici du HCl, chlorure d'hydrogène). Arroser augmenterait donc le risque."},
 {q:"Quand utilise-t-on la colonne « nuit » des pages vertes ?",a:"Entre le coucher et le lever du soleil",w:["Seulement après minuit","Quand il pleut","Quand il fait moins de 0 °C"],e:"« Nuit » = du <b>coucher au lever du soleil</b>. L'air y est plus stable : les distances de protection sont plus grandes."}
]}
];

const $=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function show(sec){["menu","quiz","results"].forEach(id=>$(id).hidden=(id!==sec));window.scrollTo(0,0);}
function ctxHtml(s){return `<div class="ctitle">${s.ic} ${s.t}</div>${s.ctx}${s.data?`<div class="data">${s.data}</div>`:""}`;}
function prep(it,label,ctx){return {label,text:it.q,ctx,correct:it.a,options:shuffle([it.a,...it.w]),expl:it.e};}

/* ---------- MENU ---------- */
function card(o,cb){const b=document.createElement("button");b.className="mode";
  b.innerHTML=`${o.ch?`<span class="ch">${o.ch}</span>`:""}<span class="ic">${o.ic}</span><span class="t">${o.t}</span><span class="d">${o.d}</span>`;b.onclick=cb;return b;}
SCENARIOS.forEach((s,i)=>$("scenList").appendChild(card({...s,ch:`Situation ${i+1} · ${s.qs.length} questions`},()=>runScenario(s))));
const rnd=card({ic:"🎲",t:"Au hasard",d:"Une mise en situation tirée au sort",ch:"Surprise"},()=>runScenario(SCENARIOS[Math.random()*SCENARIOS.length|0]));
rnd.classList.add("full");$("scenList").appendChild(rnd);
THEMES.forEach(t=>$("themeList").appendChild(card(t,()=>runTheme(t))));

/* ---------- LANCEURS ---------- */
let questions=[],idx=0,score=0,answered=false,again=null;
function start(qs,retry){questions=qs;again=retry;idx=0;score=0;show("quiz");renderQ();}
function runScenario(s){start(s.qs.map(q=>prep(q,"Mise en situation",ctxHtml(s))),()=>runScenario(s));}
function runTheme(t){start(shuffle(t.qs).slice(0,10).map(q=>prep(q,`${t.ch} · ${t.t}`,"")),()=>runTheme(t));}
function runMock(){
  const sc=shuffle(SCENARIOS).slice(0,3).flatMap(s=>s.qs.map(q=>prep(q,"Mise en situation",ctxHtml(s))));
  const th=shuffle(THEMES.flatMap(t=>t.qs.map(q=>prep(q,`${t.ch} · ${t.t}`,"")))).slice(0,10);
  start(sc.concat(th),runMock);
}
$("mock").onclick=runMock;

/* ---------- QUIZ ---------- */
function renderQ(){
  answered=false;const q=questions[idx];
  $("ctx").innerHTML=q.ctx;$("ctx").hidden=!q.ctx;
  $("qlabel").textContent=q.label;$("qtext").textContent=q.text;
  $("count").textContent=`${idx+1} / ${questions.length}`;
  $("bar").style.width=`${idx/questions.length*100}%`;
  $("expl").hidden=true;$("next").hidden=true;
  const box=$("opts");box.innerHTML="";
  q.options.forEach(o=>{const b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=()=>choose(b,o,q);box.appendChild(b);});
}
function choose(btn,val,q){
  if(answered)return;answered=true;
  const ok=val===q.correct;if(ok)score++;
  [...$("opts").children].forEach(b=>{b.disabled=true;if(b.textContent===q.correct)b.classList.add("correct");else if(b===btn)b.classList.add("wrong");});
  $("expl").innerHTML=(ok?"✅ ":"❌ ")+q.expl;$("expl").hidden=false;
  $("bar").style.width=`${(idx+1)/questions.length*100}%`;
  $("next").hidden=false;$("next").textContent=idx+1<questions.length?"Suivant →":"Voir mon résultat";
}
$("next").onclick=()=>{idx++;if(idx<questions.length)renderQ();else finish();};
function finish(){
  show("results");const total=questions.length,pct=score/total;
  $("finalScore").textContent=`${score} / ${total}`;
  $("finalScore").style.color=pct>=0.8?"var(--ok)":pct>=0.5?"var(--warn)":"var(--bad)";
  $("finalMsg").textContent=pct===1?"Parfait ! Tu maîtrises.":pct>=0.8?"Très bien : tu atteins le seuil de réussite de 80 %.":pct>=0.5?"Correct, mais sous le seuil de 80 %. Continue à réviser.":"À retravailler : refais un tour.";
}
$("retry").onclick=()=>again&&again();
$("toMenu").onclick=()=>show("menu");
document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>show("menu"));
$("theme").onclick=()=>{const r=document.documentElement;const dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);r.setAttribute("data-theme",dark?"light":"dark");};
</script>
</body>
</html>
